server.port=${PORT:8080}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.url=jdbc:sqlite:${DB_PATH:./data/travel.db}?foreign_keys=on&busy_timeout=10000&journal_mode=WAL&synchronous=NORMAL&transaction_mode=IMMEDIATE
spring.datasource.hikari.maximum-pool-size=8
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.jackson.deserialization.use-big-decimal-for-floats=true
spring.jackson.default-property-inclusion=non_null
spring.main.banner-mode=off
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.generator.write-bigdecimal-as-plain=true
